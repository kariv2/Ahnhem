<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ញញឹម - OLICA X NICK IT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070c;
      font-family: 'Kantumruy Pro', 'Battambang', -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. SCREEN-FILLED CODE BACKGROUND */
    #code-viewport {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #05070c;
      display: flex;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(6.2px, 1.1vw, 8px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      z-index: 0;
      opacity: 0.82;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .code-pane {
      flex: 1;
      display: flex;
      padding: 6px 10px;
      border-right: 1px solid #101622;
      overflow: hidden;
    }

    .gutter {
      width: 28px;
      text-align: right;
      padding-right: 6px;
      color: #242c3d;
      user-select: none;
      border-right: 1px solid #0d121c;
    }

    .code-content {
      flex: 1;
      padding-left: 8px;
      white-space: pre;
      color: #9aa5b5;
      overflow: hidden;
    }

    .kw { color: #f47067; font-weight: bold; }
    .fn { color: #dcbdfb; }
    .str { color: #96d0ff; }
    .type { color: #8ddb8c; }
    .hex { color: #6cb6ff; }
    .comm { color: #384252; font-style: italic; }
    .var { color: #adbac7; }

    #dark-veil {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 55%, rgba(6, 8, 13, 0.3) 0%, rgba(3, 4, 7, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================
       2. BEAT DROP CINEMATIC SHOCKWAVE, TREMOR & SONIC RIPPLES
       ========================================================== */
    #beat-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(144, 205, 244, 0.45) 0%, rgba(15, 25, 45, 0.85) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 9000;
    }
    #beat-flash.active {
      animation: shockwavePulse 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes shockwavePulse {
      0% { opacity: 0.95; }
      18% { opacity: 0.4; }
      100% { opacity: 0; }
    }

    body.tremor-active {
      animation: emotionalTremor 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes emotionalTremor {
      10%, 90% { transform: translate3d(-1px, 2px, 0); }
      20%, 80% { transform: translate3d(2px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 2px, 0); }
      40%, 60% { transform: translate3d(4px, -3px, 0); }
    }

    /* SONIC BASS RIPPLES RADIATING WITH THE DRUM KICKS */
    .sound-ripple {
      position: fixed;
      border-radius: 50%;
      border: 1.5px solid rgba(144, 205, 244, 0.7);
      box-shadow: 0 0 25px rgba(144, 205, 244, 0.5), inset 0 0 15px rgba(144, 205, 244, 0.3);
      pointer-events: none;
      z-index: 9500;
      animation: rippleExpand 1.35s cubic-bezier(0.08, 0.82, 0.25, 1) forwards;
    }
    @keyframes rippleExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.35);
        opacity: 0.95;
      }
      100% {
        transform: translate(-50%, -50%) scale(3.2);
        opacity: 0;
      }
    }

    /* ==========================================================
       3. EXTRA-LARGE SAD CARD WITH SOUNDWAVE UNDULATION
       ========================================================== */
    .sad-card {
      position: fixed;
      width: min(92vw, 540px);
      min-height: 155px;
      padding: 26px 32px;
      background: linear-gradient(150deg, rgba(21, 29, 44, 0.96) 0%, rgba(8, 13, 21, 0.98) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(210, 230, 255, 0.55);
      border-radius: 16px;
      box-shadow: 
        0 24px 50px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(144, 205, 244, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 9999;
      pointer-events: none;
      will-change: transform, opacity;
      transition: border-color 0.6s, box-shadow 0.6s;
    }

    .sad-card::before {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(210, 230, 255, 0.25); border-radius: 11px; pointer-events: none;
    }

    /* CLIMAX BLOOM (Rhythmic pulse on the beat drop) */
    .sad-card.climax-bloom {
      border-color: rgba(188, 227, 255, 0.95) !important;
      box-shadow: 
        0 30px 65px rgba(0, 0, 0, 0.95),
        0 0 55px rgba(144, 205, 244, 0.75),
        inset 0 0 25px rgba(144, 205, 244, 0.35) !important;
      /* Undulating S-Curve motion that flows with the sound */
      animation: soundwaveClimaxFloat 6.8s cubic-bezier(0.16, 0.9, 0.3, 1) forwards !important;
    }

    @keyframes soundwaveClimaxFloat {
      0% {
        opacity: 0;
        transform: translate3d(60px, 40px, 0) scale(0.92) rotate(2.5deg);
      }
      10% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
      }
      30% {
        transform: translate3d(-14px, -35px, 0) scale(1.03) rotate(-1deg);
      }
      55% {
        transform: translate3d(16px, -75px, 0) scale(0.99) rotate(1.2deg);
      }
      80% {
        transform: translate3d(-12px, -115px, 0) scale(1.02) rotate(-0.5deg);
      }
      100% {
        opacity: 0.96;
        transform: translate3d(0, -150px, 0) scale(1.01) rotate(0deg);
      }
    }

    .from-left {
      animation: flowFromLeft 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromLeft {
      0% { opacity: 0; transform: translate3d(-70px, 45px, 0) scale(0.92) rotate(-3deg); }
      12% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(-1.2deg); }
      100% { opacity: 1; transform: translate3d(18px, -110px, 0) scale(1) rotate(-0.5deg); }
    }

    .from-right {
      animation: flowFromRight 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromRight {
      0% { opacity: 0; transform: translate3d(70px, 45px, 0) scale(0.92) rotate(3deg); }
      12% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(1.2deg); }
      100% { opacity: 1; transform: translate3d(-18px, -110px, 0) scale(1) rotate(0.5deg); }
    }

    .sad-card.exiting {
      animation: exitDissolve 0.38s ease-out forwards !important;
    }
    @keyframes exitDissolve {
      to { opacity: 0; transform: translateY(-145px) scale(0.94); }
    }

    .card-meta {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 11.5px; 
      letter-spacing: 0.15em;
      color: rgba(210, 230, 255, 0.8); 
      text-align: center; 
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(144, 205, 244, 0.4);
    }

    .card-lyric {
      color: #ffffff;
      font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
      font-size: clamp(21px, 2.7vw, 27px);
      font-weight: 600; 
      line-height: 1.6;
      text-align: center; 
      text-shadow: 
        0 0 14px rgba(255, 255, 255, 0.85),
        0 0 28px rgba(144, 205, 244, 0.6),
        0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .lyric-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      animation: wordReveal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: 0 4px;
    }
    @keyframes wordReveal { to { opacity: 1; transform: translateY(0); } }

    .doodle-emote {
      display: inline-block;
      margin-left: 10px;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #bce3ff;
      border: 1.5px solid rgba(188, 227, 255, 0.6);
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(144, 205, 244, 0.16);
      letter-spacing: 0.05em;
      box-shadow: 0 0 14px rgba(188, 227, 255, 0.5);
      animation: gentlePulse 1.4s ease infinite;
      vertical-align: middle;
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* 4. AMBIENT DRAWING DOODLES */
    .ambient-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.85), 0 0 24px rgba(144, 205, 244, 0.6);
      animation: floatDoodle 5.5s ease-out forwards;
      opacity: 0.88;
      letter-spacing: 0.08em;
    }

    @keyframes floatDoodle {
      0% { transform: translateY(0) scale(0.75) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; transform: translateY(-30px) scale(1.05) rotate(6deg); }
      75% { opacity: 0.95; }
      100% { transform: translateY(-380px) scale(1.2) rotate(-8deg); opacity: 0; }
    }

    .burst-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 9500;
      font-family: 'Courier New', monospace;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(188, 227, 255, 0.9), 0 0 30px rgba(144, 205, 244, 0.8);
      animation: burstFloat 6.5s cubic-bezier(0.12, 0.8, 0.25, 1) forwards;
      opacity: 0;
    }
    @keyframes burstFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
      10% { opacity: 1; transform: translateY(-40px) scale(1.15) rotate(var(--rot, 5deg)); }
      80% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-550px) scale(1.3) rotate(calc(var(--rot, 5deg) * 2)); }
    }

    /* 5. OFF-SCREEN AUDIO ENGINE */
    #song-player {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 10px;
      height: 10px;
      opacity: 0.01;
      pointer-events: none;
    }

    #start-screen {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 11, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #edf2f7;
      z-index: 100000;
    }

    #start-btn {
      padding: 18px 46px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 19px;
      font-weight: 600;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: #e2e8f0;
      border: 1px solid rgba(176, 196, 222, 0.5);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.8);
      transition: transform 0.2s ease;
    }
    #start-btn:active { transform: scale(0.96); }

    .subtitle {
      margin-top: 14px;
      opacity: 0.6;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Audio source from your uploaded video -->
  <video id="song-player" playsinline webkit-playsinline preload="auto">
    <source src="f12117c668798929d30d9a1344321ba7.mp4" type="video/mp4">
  </video>

  <!-- Start Overlay -->
  <div id="start-screen">
    <button id="start-btn" onclick="startExperience()">▶ ចាក់ចម្រៀង (Play With Sound)</button>
    <p class="subtitle">(បើកសំឡេងឡើងដើម្បីស្តាប់បទភ្លេង & អក្សរ)</p>
  </div>

  <div id="code-viewport"></div>
  <div id="dark-veil"></div>
  <div id="beat-flash"></div>

  <script>
    function fillCodeBackground() {
      const container = document.getElementById('code-viewport');
      container.innerHTML = '';
      
      const snippets = [
        '<span class="kw">#include</span> <span class="str">&lt;immintrin.h&gt;</span>',
        '<span class="kw">template</span>&lt;<span class="kw">typename</span> <span class="type">Scalar</span>&gt;',
        '<span class="kw">struct</span> <span class="type">FFTSpectrumEngine</span> {',
        '    <span class="type">size_t</span> <span class="var">dim</span> = <span class="hex">4096</span>;',
        '    <span class="type">uintptr_t</span> <span class="var">alloc_ptr</span> = <span class="hex">0x7FFE9B42A000</span>;',
        '    <span class="fn">execute_butterfly</span>(<span class="var">a</span>, <span class="var">stride</span>);',
        '    __m512d <span class="var">acc</span> = <span class="fn">_mm512_fmadd_pd</span>(<span class="var">r</span>, <span class="var">i</span>, <span class="var">r</span>);',
        '};',
        '<span class="comm">// HESSIAN DRIFT EIGEN ACCUMULATOR</span>',
        '<span class="kw">class</span> <span class="type">NonlinearDriftSolver</span> {',
        '    <span class="type">double</span> <span class="var">jacobian_tensor</span>[<span class="hex">4</span>][<span class="hex">4</span>];',
        '    <span class="fn">eigen_decomp_4x4</span>(<span class="var">jacobian_tensor</span>);',
        '};',
        '<span class="kw">async def</span> <span class="fn">stream_cadence</span>(self) -&gt; <span class="type">AsyncGen</span>:',
        '    <span class="var">cues</span> = [(<span class="hex">0.6</span>, <span class="str">"smile_khmer"</span>), (<span class="hex">20.5</span>, <span class="str">"climax"</span>)]',
        '    <span class="kw">yield</span> {<span class="str">"epoch"</span>: <span class="var">t</span>, <span class="str">"hash"</span>: <span class="hex">0x9E3779B9</span>}',
        '<span class="kw">__global__ void</span> <span class="fn">VectorKernel</span>(<span class="type">float</span>* <span class="var">d_out</span>) {',
        '    <span class="type">int</span> <span class="var">idx</span> = blockIdx.x * blockDim.x + threadIdx.x;',
        '    <span class="var">d_out</span>[<span class="var">idx</span>] = <span class="fn">__fmul_rn</span>(<span class="var">val</span>, <span class="hex">0.9984f</span>);',
        '}'
      ];

      const cols = window.innerWidth > 800 ? 3 : 2;
      const linesNeeded = Math.ceil(window.innerHeight / 10) + 12;

      let lineCounter = 1;
      for (let c = 0; c < cols; c++) {
        const pane = document.createElement('div');
        pane.className = 'code-pane';
        let gutterHtml = '';
        let codeHtml = '';
        
        for (let l = 0; l < linesNeeded; l++) {
          gutterHtml += `${lineCounter}<br>`;
          codeHtml += snippets[(l + c * 6) % snippets.length] + '<br>';
          lineCounter++;
        }
        
        pane.innerHTML = `<div class="gutter">${gutterHtml}</div><div class="code-content">${codeHtml}</div>`;
        container.appendChild(pane);
      }
    }

    // TIMED KHMER LYRICS ("ញញឹម - SMILE")
    const TIMED_LYRICS = [
      { time: 1.0,  text: "តែបង នឹកអូន... តែបងនឹកអូន", duration: 3.2, emote: "~ ♡" },
      { time: 5.0,  text: "នឹកស្នេហា យើងដំបូង...",       duration: 3.2, emote: "[ ♫ ]" },
      { time: 8.5,  text: "ទីកន្លែងដែលយើងធ្លាប់ទៅជាមួយគ្នា សើចជាមួយគ្នា", duration: 4.2, emote: "( . . )" },
      { time: 13.2, text: "ក្លាយទៅជាកន្លែង ដែលបងមិនចង់ឮ...", duration: 3.2, emote: "</3" },
      { time: 16.8, text: "បេះដូងបងឈឺ... ហា... ហា...",   duration: 3.2, emote: "[ 💔 ]" },
      // CLIMAX BEAT DROP AT 20.5s:
      { time: 20.5, text: "ពីយប់ដល់ភ្លឺ បងទប់ទឹកភ្នែកស្ទើរដាច់ដង្ហើម...", duration: 4.2, emote: "? <3", isBeatDrop: true, meta: "✦ [ ញញឹម • OLICA ] ✦" }
    ];

    // EXACT BASS KICK TIMESTAMPS OF THE BEAT DROP RHYTHM
    const BEAT_HITS = [20.5, 21.3, 22.1, 22.9, 23.7, 24.5];

    let currentCard = null;
    let hasStarted = false;
    let firedLyrics = new Set();
    let firedHits = new Set();

    function startExperience() {
      if (hasStarted) return;
      hasStarted = true;

      document.getElementById('start-screen').style.display = 'none';

      const player = document.getElementById('song-player');
      player.muted = false;

      player.play().catch(e => {
        console.warn("Playback error:", e);
      });

      setInterval(spawnAmbientDoodle, 180);

      // REAL-TIME AUDIO SYNCHRONIZATION: Listens directly to audio.currentTime
      player.ontimeupdate = handleAudioSync;

      // Loop video soundlessly when song finishes
      player.onended = () => {
        firedLyrics.clear();
        firedHits.clear();
        player.currentTime = 0;
        player.play();
      };
    }

    // Real-Time Audio-Synced Engine (Zero Drift)
    function handleAudioSync() {
      const player = document.getElementById('song-player');
      const curTime = player.currentTime;

      // 1. Sync Lyrics on audio clock
      TIMED_LYRICS.forEach((item, idx) => {
        if (curTime >= item.time && !firedLyrics.has(idx)) {
          firedLyrics.add(idx);
          const direction = (idx % 2 === 0) ? 'left' : 'right';
          spawnSingleCard(item.text, item.duration, item.emote, direction, item.isBeatDrop, item.meta);
        }
      });

      // 2. Trigger Rhythmic Sonic Ripples on the Drum Kicks of the Beat Drop
      BEAT_HITS.forEach((beatTime, idx) => {
        if (curTime >= beatTime && !firedHits.has(idx)) {
          firedHits.add(idx);
          triggerSoundwavePulse(idx === 0); // Full shockwave on first hit
        }
      });
    }

    // Pulsing Sonic Ripple radiating outward with the sound
    function triggerSoundwavePulse(isInitialDrop) {
      if (isInitialDrop) {
        document.body.classList.add('tremor-active');
        setTimeout(() => document.body.classList.remove('tremor-active'), 650);

        const flash = document.getElementById('beat-flash');
        flash.classList.remove('active');
        void flash.offsetWidth;
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 2500);

        for (let i = 0; i < 40; i++) {
          setTimeout(spawnBurstDoodle, i * 40);
        }
      }

      // Spawn Sonic Ripple from the center of the active card
      if (currentCard) {
        const rect = currentCard.getBoundingClientRect();
        const ripple = document.createElement('div');
        ripple.className = 'sound-ripple';
        const rippleX = rect.left + rect.width / 2;
        const rippleY = rect.top + rect.height / 2;
        ripple.style.left = `${rippleX}px`;
        ripple.style.top = `${rippleY}px`;
        ripple.style.width = `${rect.width * 0.75}px`;
        ripple.style.height = `${rect.height * 0.75}px`;
        document.body.appendChild(ripple);

        setTimeout(() => ripple.remove(), 1400);
      }
    }

    function spawnBurstDoodle() {
      const burstList = ['</3', '♡', '<3', '( . . )', '✧', '*ੈ✩', '˚₊·', '...', '˙ᵕ˙'];
      const el = document.createElement('div');
      el.className = 'burst-doodle';
      el.textContent = burstList[Math.floor(Math.random() * burstList.length)];

      const size = Math.floor(15 + Math.random() * 12);
      el.style.fontSize = `${size}px`;

      const rot = (Math.random() - 0.5) * 35;
      el.style.setProperty('--rot', `${rot}deg`);

      const x = Math.floor(Math.random() * (window.innerWidth - 40));
      const y = Math.floor(window.innerHeight * 0.70 + Math.random() * (window.innerHeight * 0.25));

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 6500);
    }

    function spawnSingleCard(fullText, vocalDuration, emote, side, isBeatDrop, customMeta) {
      if (currentCard) {
        const oldCard = currentCard;
        oldCard.classList.add('exiting');
        setTimeout(() => oldCard.remove(), 380);
      }

      const card = document.createElement('div');
      card.className = `sad-card ${side === 'left' ? 'from-left' : 'from-right'} ${isBeatD
